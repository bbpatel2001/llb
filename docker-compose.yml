version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: llb_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: llb_platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - llb_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh localhost:27017/test --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llb_backend
    ports:
      - "6000:6000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password@mongodb:27017/llb_platform?authSource=admin
      PORT: 6000
      CORS_ORIGIN: http://localhost:6001
      JWT_SECRET: ${JWT_SECRET:-change_this_to_secure_random_string}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - llb_network
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: llb_frontend
    ports:
      - "6001:6001"
    environment:
      VITE_API_URL: ""
      VITE_API_PROXY_TARGET: http://backend:6000
    depends_on:
      - backend
    networks:
      - llb_network
    volumes:
      - ./react-frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongodb_data:

networks:
  llb_network:
    driver: bridge
