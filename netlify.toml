[build]
  command = "npm install --no-audit --no-fund && npm --prefix backend install --no-audit --no-fund && npm --prefix react-frontend install --no-audit --no-fund && npm --prefix react-frontend run build"
  publish = "react-frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Keep this deployment configuration change as a safe redeploy trigger.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
